name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  server:
    name: Servidor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Sem TEST_DATABASE_URL: os testes de banco são pulados (rodam no job "db")
      - run: npm test
      - run: npm run build
      - name: Build da imagem Docker
        run: docker build -t tanquei-server .

  db:
    name: Banco (branch descartável do Neon)
    # Só em PRs: cria e apaga uma branch do Neon a cada execução.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: server
    defaults:
      run:
        working-directory: server
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Verificar credenciais do Neon
        id: neon
        working-directory: .
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::notice::NEON_API_KEY/NEON_PROJECT_ID não configurados (ou PR de fork): testes de banco pulados."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.neon.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.neon.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.neon.outputs.enabled == 'true'
        run: npm ci
      - if: steps.neon.outputs.enabled == 'true'
        run: npm install -g neon@8.17.1
      - if: steps.neon.outputs.enabled == 'true'
        run: npm run test:db
